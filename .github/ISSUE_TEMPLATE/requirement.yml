name: Requirement
description: Define a testable requirement for the decision engine (core engine, CLI, API, or documentation).
title: "[REQ-<MODULE>-<###>] <Concise requirement name>"
labels: ["requirement"]
body:
  - type: markdown
    attributes:
      value: |
        Write one requirement per issue. The issue title is the requirement **Title**; keep the `[REQ-…]` prefix in sync with the ID below.
        Architecture: `ARCHITECTURE.md`. Security rules: `.claude/rules/security.md`.

  # ── Metadata ─────────────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Metadata"
  - type: input
    id: req_id
    attributes:
      label: ID
      description: "Format: REQ-[Module]-[###]"
      placeholder: REQ-AUTH-001
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Semantic version of this requirement.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Draft
        - Review
        - Approved
        - Deprecated
      default: 0
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author
      placeholder: Name
    validations:
      required: true
  - type: input
    id: last_updated
    attributes:
      label: Last Updated
      description: ISO 8601 date.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Classification
      options:
        - Functional
        - Security
        - Compliance
        - Performance
        - Operational
    validations:
      required: true

  # ── Requirement ──────────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Requirement"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Single-sentence, unambiguous statement of what the system MUST do. Use RFC 2119 keywords: MUST, MUST NOT, SHALL, SHOULD, MAY."
      placeholder: The core engine MUST ...
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why this requirement exists (business, regulatory, or threat-driven justification).
    validations:
      required: true

  # ── Scope ────────────────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Scope"
  - type: dropdown
    id: applies_to
    attributes:
      label: Applies To
      multiple: true
      options:
        - Core Engine
        - CLI
        - API
        - Documentation
    validations:
      required: true
  - type: input
    id: components
    attributes:
      label: Components
      placeholder: e.g., Rules (CA), Fact schema, /v1 batch endpoint, Decision log, API key store
  - type: input
    id: actors
    attributes:
      label: Actors
      placeholder: e.g., Operations/compliance staff, API client, Reviewing attorney
  - type: dropdown
    id: data_classification
    attributes:
      label: Data Classification
      description: The system collects no PII by design (see ARCHITECTURE.md). Selecting Restricted/PII needs justification in Rationale.
      multiple: true
      options:
        - Public
        - Internal
        - Confidential
        - Restricted/PII
        - Regulated (PCI-DSS, SOX, GLBA)

  # ── Security Context ─────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Security Context"
  - type: dropdown
    id: defense_layer
    attributes:
      label: Defense Layer
      multiple: true
      options:
        - Architecture
        - Input Validation
        - Strict API
        - Encoding
        - Sanitization
  - type: input
    id: threats
    attributes:
      label: Threat(s) Addressed
      placeholder: e.g., OWASP Top Ten A01:2021, CWE-89, STRIDE category
  - type: input
    id: trust_boundary
    attributes:
      label: Trust Boundary
      description: Where does this requirement enforce a trust boundary?
      placeholder: e.g., API request → Pydantic fact schema; API layer → PostgreSQL
  - type: textarea
    id: zero_trust
    attributes:
      label: Zero Trust Consideration
      description: How does this requirement treat input as untrusted? What independent validation does it perform?

  # ── Standards Alignment ──────────────────────────────────
  - type: markdown
    attributes:
      value: "## Standards Alignment"
  - type: input
    id: asvs
    attributes:
      label: OWASP ASVS
      placeholder: e.g., V2.1.1
  - type: input
    id: aisvs
    attributes:
      label: OWASP AISVS
      description: Only if AI/LLM components are involved. None are allowed in the decision path (see `.claude/rules/security.md`).
      placeholder: N/A
  - type: input
    id: nist_800_53
    attributes:
      label: NIST SP 800-53
      placeholder: e.g., SI-10, AC-3
  - type: input
    id: nist_800_207
    attributes:
      label: NIST SP 800-207
      placeholder: Zero Trust principle, if applicable
  - type: input
    id: regulatory
    attributes:
      label: Regulatory
      placeholder: e.g., PCI-DSS requirement, GLBA/Reg P section, SOX control, OCC guidance, FFIEC reference
  - type: input
    id: other_standards
    attributes:
      label: Other
      placeholder: e.g., RFC 9700, FIDO2/WebAuthn, ISO 27001 control

  # ── Legal Rule Context ───────────────────────────────────
  - type: markdown
    attributes:
      value: |
        ## Legal Rule Context
        Complete this section only for requirements that encode law. Otherwise set Jurisdiction to N/A.
  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      options:
        - N/A
        - CA
        - WA
        - Both
      default: 0
  - type: input
    id: statute_citations
    attributes:
      label: Statute Citation(s)
      placeholder: e.g., RCW 11.62.010, Cal. Prob. Code §13100
  - type: input
    id: effective_date
    attributes:
      label: Effective Date
      description: Applies to deaths on or after this date.
      placeholder: YYYY-MM-DD
  - type: dropdown
    id: attorney_review
    attributes:
      label: Attorney Review Status
      options:
        - N/A
        - Not Reviewed
        - In Review
        - Approved
        - Changes Requested
      default: 0
  - type: input
    id: golden_scenarios
    attributes:
      label: Golden Scenario IDs
      description: Scenarios that verify this rule.
  - type: textarea
    id: open_questions
    attributes:
      label: Open Questions
      description: Links to open-questions entries, if any.

  # ── Acceptance Criteria ──────────────────────────────────
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Each criterion MUST be independently testable. Use Given/When/Then or explicit pass/fail conditions.
      value: |
        1. **AC-01**: Given [precondition], when [action], then [expected outcome].
        2. **AC-02**: Given [precondition], when [invalid/malicious input], then [system rejects input and returns appropriate error - no processing occurs].
        3. **AC-03**: [Negative test case - what MUST NOT happen.]
    validations:
      required: true

  # ── Failure Behavior ─────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Failure Behavior"
  - type: input
    id: on_invalid_input
    attributes:
      label: On Invalid Input
      placeholder: Reject with HTTP <status code>, log event with correlation ID, do NOT disclose internal state.
  - type: dropdown
    id: on_system_error
    attributes:
      label: On System Error
      options:
        - Fail closed
        - Fail open (requires explicit justification)
        - Circuit breaker behavior
      default: 0
  - type: input
    id: alerting
    attributes:
      label: Alerting
      placeholder: What triggers an alert? Threshold? Destination?

  # ── Test Strategy ────────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Test Strategy"
  - type: textarea
    id: unit_tests
    attributes:
      label: Unit Tests
      description: What logic is unit-testable? Target coverage.
  - type: textarea
    id: integration_tests
    attributes:
      label: Integration Tests
      description: Cross-service or cross-boundary validation.
  - type: textarea
    id: security_tests
    attributes:
      label: Security Tests
      description: SAST rule, DAST scan target, fuzzing input class, manual pentest checklist item.
  - type: textarea
    id: compliance_tests
    attributes:
      label: Compliance Tests
      description: Automated evidence collection for audit (log presence, config validation, policy enforcement).
  - type: input
    id: coverage_target
    attributes:
      label: Coverage Target
      value: "≥ 80% branch coverage for implementing module"

  # ── Dependencies ─────────────────────────────────────────
  - type: markdown
    attributes:
      value: "## Dependencies"
  - type: input
    id: upstream
    attributes:
      label: Upstream
      description: Requirements this depends on.
      placeholder: e.g., REQ-AUTH-001 must be satisfied before REQ-TXN-003
  - type: input
    id: downstream
    attributes:
      label: Downstream
      description: Requirements that depend on this one.
  - type: input
    id: external
    attributes:
      label: External
      placeholder: Third-party services, HSMs, identity providers, core banking APIs

  # ── Implementation Notes ─────────────────────────────────
  - type: markdown
    attributes:
      value: "## Implementation Notes"
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Technology constraints, latency budgets, regulatory deadlines.
  - type: textarea
    id: anti_patterns
    attributes:
      label: Anti-Patterns
      description: Explicitly prohibited approaches.
      placeholder: |
        - MUST NOT use client-side validation as sole enforcement
        - MUST NOT log raw facts, PII, or credentials
  - type: textarea
    id: ai_guidance
    attributes:
      label: AI Development Guidance
      description: If AI-assisted development is used, reference the applicable prompt library, required CLAUDE.md rules, and mandatory human review gates.
      value: |
        - Rules: `.claude/rules/security.md`
        - Prompts: per "Prompt Placeholders To Resolve" in `.claude/rules/security.md`
        - Human review gate: reviewed PR required; rule changes also need attorney review
