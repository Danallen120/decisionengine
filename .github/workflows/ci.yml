# Quality and security gates for every PR (REQ-OPS-001).
# Third-party actions are pinned to full commit SHAs; the tag is in the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Types (strict)
        run: uv run --locked mypy src
      - name: Architecture boundaries
        run: uv run --locked lint-imports
      - name: Tests, golden scenarios, coverage (>= 80% overall)
        run: uv run --locked pytest --cov --cov-report=term-missing --junitxml=test-results.xml
      - name: Coverage (100% branch for core engine and state logic)
        run: >-
          uv run --locked coverage report --fail-under=100
          --include='src/decision_engine/core/*,src/decision_engine/state_logic/*'
      - name: Render golden scenarios for attorney review
        run: uv run --locked decision-engine golden golden/ > golden-scenarios.md
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ github.sha }}
          path: |
            test-results.xml
            golden-scenarios.md
          retention-days: 90

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --locked --format requirements-txt --no-emit-project -o requirements-audit.txt
          uv run --locked pip-audit --strict --disable-pip --require-hashes -r requirements-audit.txt

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Types (strict)
        run: npm run typecheck
      - name: Tests and coverage (>= 80%)
        run: npm run coverage
      - name: Build
        run: npx vite build
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
