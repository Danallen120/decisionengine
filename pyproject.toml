[project]
name = "decision-engine"
version = "0.1.0"
description = "Deterministic, statute-cited entitlement decision engine for deceased customers' financial accounts."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2,<7",
]

[project.scripts]
decision-engine = "decision_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine"]

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
]

[tool.uv]
required-version = ">=0.8"

# ── Lint / format ─────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",      # test signatures are self-evident
    "D",        # test names are the documentation
    "PLR2004",  # literal expected values are the point of a test
    "S101",     # pytest uses assert
    "S603",     # determinism test runs our own interpreter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ── Types ─────────────────────────────────────────────────
[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── Tests / coverage ──────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["decision_engine"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "if __name__ == .__main__.:"]

# ── Architecture boundaries (REQ-CORE-003) ────────────────
[tool.importlinter]
root_package = "decision_engine"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core engine depends on nothing outside itself except pydantic"
type = "forbidden"
source_modules = ["decision_engine.core"]
forbidden_modules = [
    "decision_engine.cli",
    "decision_engine.golden",
    "decision_engine.rules_loader",
    "decision_engine.state_logic",
    "yaml",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "decision_engine.cli",
    "decision_engine.golden",
    "decision_engine.rules_loader",
    "decision_engine.state_logic",
    "decision_engine.core",
]
